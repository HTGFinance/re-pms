# RE-PMS — run the full system on one server:  docker compose up -d --build
# Then create the first admin login once:       docker compose run --rm api npm run seed:prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Muscat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    depends_on: [api]
    ports:
      - "3000:3000"   # put a reverse proxy with HTTPS (Nginx, Caddy or the cloud load balancer) in front of this

volumes:
  pgdata:
